<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>برنامه کانبان</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eaf0f7;--surface:#fff;--col:#dde6f1;--ink:#14213d;--mute:#5b6b86;--line:#c9d5e5;
--learn:#2f6fed;--gym:#e5484d;--teach:#7c4dff;--work:#f08a00;
--c0:#5b6b86;--c1:#f08a00;--c2:#0e9aa7;--c3:#2e9e5b}
:root[data-theme="dark"]{--bg:#0e1626;--surface:#1a2740;--col:#14203a;--ink:#eaf0ff;--mute:#93a4c4;--line:#2a3a5c;
--learn:#6b9bff;--gym:#ff7b7f;--teach:#a98bff;--work:#ffb04d;--c0:#93a4c4;--c1:#ffb04d;--c2:#3fd0dc;--c3:#4fd18a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--surface:#1a2740;--col:#14203a;--ink:#eaf0ff;--mute:#93a4c4;--line:#2a3a5c;
--learn:#6b9bff;--gym:#ff7b7f;--teach:#a98bff;--work:#ffb04d;--c0:#93a4c4;--c1:#ffb04d;--c2:#3fd0dc;--c3:#4fd18a}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Vazirmatn",Tahoma,sans-serif;line-height:1.7;min-height:100vh}
header{padding:28px 20px 8px;max-width:1200px;margin:auto}
h1{margin:0;font-size:clamp(28px,5vw,44px);font-weight:800;letter-spacing:-.5px}
.sub{color:var(--mute);margin:2px 0 16px}
.prog{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px}
.bar{flex:1;height:12px;background:var(--col);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c2),var(--c3));border-radius:99px;transition:width .5s}
.prog b{font-size:20px;min-width:44px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 14px;font-size:14px}
.chip span{color:var(--mute)}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-width:1200px;margin:auto;padding:16px 20px 40px}
.col{background:var(--col);border-radius:20px;padding:12px;min-height:240px;border-top:5px solid var(--cc)}
.col.over{outline:2px dashed var(--cc)}
.col h2{margin:4px 6px 12px;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.col h2 em{font-style:normal;background:var(--cc);color:#fff;border-radius:99px;min-width:26px;text-align:center;font-size:13px;padding:0 8px}
.card{background:var(--surface);border-radius:14px;padding:10px 12px;margin-bottom:10px;border-inline-start:5px solid var(--k);box-shadow:0 1px 2px rgba(20,33,61,.08);cursor:grab}
.card.done .t{text-decoration:line-through;color:var(--mute)}
.t{font-weight:600}
.h{font-size:13px;color:var(--k);font-weight:600}
.mv{display:flex;justify-content:space-between;margin-top:6px}
.mv button{font:inherit;border:0;background:var(--col);color:var(--ink);border-radius:8px;width:34px;height:30px;cursor:pointer}
.mv button:hover{background:var(--k);color:#fff}
.mv button:disabled{opacity:.25;cursor:default;background:var(--col);color:var(--ink)}
button:focus-visible{outline:3px solid var(--learn);outline-offset:2px}
.empty{color:var(--mute);font-size:13px;text-align:center;padding:18px 6px}
.reset{font:inherit;margin:0 20px 30px;background:none;border:1px solid var(--line);color:var(--mute);border-radius:99px;padding:4px 16px;cursor:pointer}
@media(max-width:820px){
.board{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;padding-inline:16px}
.col{flex:0 0 82%;scroll-snap-align:center}}
</style>
</head>
<body>
<header>
<h1>برنامه کانبان</h1>
<p class="sub">ساختار هفتگی برنامه‌ها — کارت را با کشیدن یا دکمه‌های ← → جابه‌جا کنید</p>
<div class="prog"><span>پیشرفت هفته</span><div class="bar"><i id="fill"></i></div><b id="pct">۰٪</b></div>
<div class="chips">
<div class="chip"><span>مجموع دوره‌ها:</span> ۲۶ ساعت</div>
<div class="chip"><span>تدریس:</span> روزی ۱ ساعت</div>
<div class="chip"><span>ورکشاپ:</span> شنبه و چهارشنبه، ۱۸:۰۰ تا ۲۰:۰۰</div>
<div class="chip"><span>باشگاه:</span> ۳ جلسه در هفته</div>
</div>
</header>
<main class="board" id="board"></main>
<button class="reset" id="reset">بازنشانی برنامه</button>
<script>
var COLS=[["📥 Backlog","var(--c0)"],["📝 این هفته","var(--c1)"],["🔄 در حال انجام","var(--c2)"],["✅ انجام‌شده","var(--c3)"]];
var CAT={learn:["📚 یادگیری","var(--learn)"],gym:["🏋️ ورزش","var(--gym)"],teach:["👨‍🏫 تدریس","var(--teach)"],work:["🗓 ورکشاپ","var(--work)"]};
var INIT=[
["دوره لینکدین — ۶ ساعت","learn",0],["دوره مدیریت محصول — ۱۰ ساعت","learn",0],["کار با هوش مصنوعی — ۶ ساعت","learn",0],
["ویدیوهای کوشیار و رترو — ۴ ساعت","learn",0],["باشگاه","gym",0],["تدریس","teach",0],["ورکشاپ شنبه ۶–۸","work",0],["ورکشاپ چهارشنبه ۶–۸","work",0],
["لینکدین — ۲ ساعت","learn",1],["مدیریت محصول — ۳ ساعت","learn",1],["هوش مصنوعی — ۲ ساعت","learn",1],["کوشیار و رترو — ۱ ساعت","learn",1],
["باشگاه — ۳ جلسه","gym",1],["تدریس — روزی ۱ ساعت","teach",1],["ورکشاپ شنبه","work",1],["ورکشاپ چهارشنبه","work",1]
].map(function(a,i){return{id:i,t:a[0],c:a[1],col:a[2],w:i>7?1:0}});
var S=INIT.map(function(x){return Object.assign({},x)});
try{var sv=JSON.parse(localStorage.getItem("kanban-fa"));if(sv&&sv.length===S.length)S=sv}catch(e){}
function save(){try{localStorage.setItem("kanban-fa",JSON.stringify(S))}catch(e){}}
var fa=function(n){return n.toLocaleString("fa-IR")};
function move(id,to){var c=S.find(function(x){return x.id==id});if(c&&to>=0&&to<4){c.col=to;save();render()}}
function render(){
 var b=document.getElementById("board");b.innerHTML="";
 COLS.forEach(function(cd,ci){
  var col=document.createElement("section");col.className="col";col.style.setProperty("--cc",cd[1]);
  var items=S.filter(function(x){return x.col===ci});
  col.innerHTML="<h2>"+cd[0]+"<em>"+fa(items.length)+"</em></h2>";
  col.ondragover=function(e){e.preventDefault();col.classList.add("over")};
  col.ondragleave=function(){col.classList.remove("over")};
  col.ondrop=function(e){e.preventDefault();col.classList.remove("over");move(e.dataTransfer.getData("text/plain"),ci)};
  if(!items.length){var em=document.createElement("div");em.className="empty";em.textContent="کارتی اینجا نیست";col.appendChild(em)}
  items.forEach(function(x){
   var k=CAT[x.c],d=document.createElement("div");d.className="card"+(ci===3?" done":"");d.style.setProperty("--k",k[1]);d.draggable=true;
   d.ondragstart=function(e){e.dataTransfer.setData("text/plain",x.id)};
   d.innerHTML='<div class="h">'+k[0]+'</div><div class="t">'+x.t+'</div><div class="mv"><button aria-label="مرحله قبل" '+(ci===0?"disabled":"")+'>→</button><button aria-label="مرحله بعد" '+(ci===3?"disabled":"")+'>←</button></div>';
   var bt=d.querySelectorAll("button");bt[0].onclick=function(){move(x.id,ci-1)};bt[1].onclick=function(){move(x.id,ci+1)};
   col.appendChild(d)});
  b.appendChild(col)});
 var wk=S.filter(function(x){return x.w}),dn=wk.filter(function(x){return x.col===3}).length,p=Math.round(dn/wk.length*100);
 document.getElementById("fill").style.width=p+"%";document.getElementById("pct").textContent=fa(p)+"٪";
}
document.getElementById("reset").onclick=function(){S=INIT.map(function(x){return Object.assign({},x)});save();render()};
render();
</script>
</body>
</html>
